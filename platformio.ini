; USR Modem Emulator - PlatformIO project
; Target: ESP32-S3 N16R8 (16 MB QIO flash, 8 MB octal PSRAM), Arduino core 3.3 on ESP-IDF 6.1
;
; Environments
;   s3      build and upload over USB (the USB-C port on the onboard USB-serial chip)
;   s3_ota  upload over Wi-Fi (ArduinoOTA). Put USR_MODEM_PASSWORD in .env (see
;           .env.example) or the environment first.
;   native  unit tests on the PC (no board needed)
;
; Every upload runs the native unit tests first and stops if any fail
; (scripts/pre_upload_tests.py).

[platformio]
default_envs = s3

[env]
extra_scripts = pre:scripts/version.py

[env:s3]
build_unflags =
    -DARDUINO_USB_MODE=1
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino, espidf
platform_packages =
    platformio/framework-arduinoespressif32@4.30312.261024
    platformio/framework-espidf@4.60100.0
    platformio/toolchain-xtensa-esp-elf@15.2.0+20251204
    platformio/toolchain-riscv32-esp@15.2.0+20251204
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
; Warnings for project code only: scripts/project_warnings.py (lib/) and src/CMakeLists.txt.
; The Arduino libraries the firmware uses are compiled once, by the Arduino component
; (CONFIG_ARDUINO_SELECTIVE_* in sdkconfig.defaults), so PlatformIO must not build them again.
lib_ignore =
    ArduinoOTA
    ESPmDNS
    FS
    Hash
    LittleFS
    Network
    Preferences
    Update
    WiFi
extra_scripts =
    pre:scripts/pin_config.py
    pre:scripts/network_dependencies.py
    pre:scripts/version.py
    pre:scripts/build_web.py
    post:scripts/project_warnings.py
    post:scripts/pre_upload_tests.py
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
debug_tool = esp-builtin
test_filter = embedded/*
check_tool = cppcheck
check_flags = cppcheck: --enable=warning,style,performance,portability --inline-suppr
check_skip_packages = yes

[env:s3_ota]
extends = env:s3
upload_protocol = espota
upload_port = usr-modem.local
; Device password (OTA and web) comes from USR_MODEM_PASSWORD (environment or .env),
; never CLI arguments.
extra_scripts =
    ${env:s3.extra_scripts}
    post:scripts/load_env.py

[env:native]
platform = native
test_framework = unity
test_filter = native/*
extra_scripts =
    pre:scripts/pin_config.py
    pre:scripts/version.py
    pre:scripts/native_link.py
build_flags =
    -std=gnu++26
    -Wall
    -Wextra
check_tool = cppcheck
check_flags = cppcheck: --enable=warning,style,performance,portability --inline-suppr
check_src_filters = +<lib/> +<src/> +<test/>
