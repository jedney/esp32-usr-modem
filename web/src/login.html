<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; form-action 'self'">
<title>Log in · Web Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='5' width='14' height='6' rx='1' fill='%23d8cfb8'/%3E%3Crect x='3' y='7' width='3' height='1.5' fill='%23ff3b30'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="menubar.css">
<script type="module" src="login.js"></script>
</head>
<body class="login-page">
<div class="page-shell">
  <header class="masthead">
    <div class="brand-mark"><img src="usr-logo.png" alt="USRobotics" width="643" height="163"></div>
    <div><div class="brand-title">USR Modem</div><div class="eyebrow">Modem terminal</div></div>
  </header>
  <main class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Log in</h1>
    <p class="login-intro" id="login-intro">Log in as <strong>admin</strong> with the device password.</p>
    <p class="login-error" id="login-error" role="alert" hidden></p>
    <form class="login-form" method="post" action="/api/login" aria-describedby="login-intro">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="button primary login-submit" type="submit">Log in</button>
    </form>
  </main>
</div>
</body>
</html>
