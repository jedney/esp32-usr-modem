<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>USR Modem</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='5' width='14' height='6' rx='1' fill='%23d8cfb8'/%3E%3Crect x='3' y='7' width='3' height='1.5' fill='%23ff3b30'/%3E%3C/svg%3E">
<link rel="stylesheet" href="xterm.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="menubar.css">
<script type="module" src="app.js"></script>
<script type="module" src="ui-commands.js"></script>
<script type="module" src="idle.js"></script>
<script type="module" src="toast.js"></script>
</head>
<body class="offline">
<div class="page-shell">
  <header class="masthead">
    <div class="brand-mark" aria-label="USR">usr</div>
    <div><div class="brand-title">Sportster</div><div class="eyebrow">Modem terminal</div></div>
    <div class="masthead-actions"><span class="badge" id="link"><i class="dot"></i><span id="link-label">Connecting</span></span><button class="button" id="open-terminal" disabled>Open terminal</button><button class="button" id="close-terminal" hidden disabled>Close terminal</button></div>
  </header>
  <div class="workspace">
    <nav class="menubar" id="menu" aria-label="Modem controls"></nav>
    <main class="terminal-frame" aria-label="Modem terminal preview">
      <div class="terminal-header">
        <span class="session-name">Browser terminal</span>
        <span class="terminal-geometry" id="terminal-geometry">UTF-8 · 80 × 25</span>
        <div class="session-actions"><span class="session-state" id="call" title="Call status"><i class="dot"></i><span id="call-label">No call</span></span><span id="remote" hidden><span id="remote-label"></span></span><span id="uptime-label" hidden></span><button class="button danger" disabled id="hangup">Hang up</button></div>
      </div>
      <div id="screen"><div id="term" aria-label="Modem terminal"></div></div>
    </main>
    <footer class="statusbar">
      <div class="leds" id="leds" aria-label="Front panel lights"></div>
      <span class="status-guidance" id="menu-reason" role="status" title="Choose a menu item or type a command. AT*HELP for all commands."><span class="guidance-long">Choose a menu item or type a command. AT*HELP for all commands.</span><span class="guidance-short">AT*HELP</span></span>
      <div class="status-right">
        <span class="wifi-signal" id="wifi" role="img" aria-label="Wi-Fi status unavailable" title="Wi-Fi status unavailable" data-bars="0">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path class="wifi-outer" d="M3 8a14 14 0 0118 0"/><path class="wifi-middle" d="M6 12a9 9 0 0112 0"/><path class="wifi-inner" d="M9 16a4 4 0 016 0"/><circle class="wifi-dot" cx="12" cy="20" r="1"/><path class="wifi-slash" d="M4 3l16 18"/></svg>
        </span>
        <span class="status-clock" id="clock-label">Clock not set</span>
      </div>
    </footer>
  </div>
</div>
<dialog id="command-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-intro">
  <div class="dialog-head"><div class="dialog-symbol" id="dialog-icon"></div><div><h1 id="dialog-title"></h1><p id="dialog-intro"></p></div></div>
  <div class="dialog-body" id="dialog-body"></div>
  <div class="dialog-actions"><span class="dialog-caption">Changes appear in the terminal</span><button class="button" id="dialog-cancel">Cancel</button><button class="button primary" id="dialog-apply">Apply setting</button></div>
</dialog>
<input id="image" type="file" accept=".bin" hidden>
<aside id="idle-guard" aria-labelledby="idle-title" hidden>
  <strong id="idle-title">Are you still there?</strong><span id="idle-countdown" role="timer"></span>
  <button class="button" id="here" type="button">I'm here</button>
</aside>
<div id="toasts" aria-label="Modem notifications"></div>
</body>
</html>
