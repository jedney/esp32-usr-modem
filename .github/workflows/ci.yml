name: CI

# Every push (any branch): check the version/change log, run the PC unit tests,
# lint, and build the ESP32-S3 firmware. The firmware image is kept as a build artifact.

on:
  push:              # every branch; results also show on the branch's pull request
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version and change log
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Check VERSION and CHANGES.md
        run: echo "version=$(python3 scripts/check_version.py)" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Unit tests (PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native

  lint:
    name: Lint (cppcheck, clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-check-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: cppcheck
        run: pio check -e native --fail-on-defect=medium
      - name: clang-format
        run: |
          files=$(git ls-files '*.cpp' '*.h')
          clang-format --dry-run --Werror $files

  web:
    name: Web interface tests and preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Build gzipped files and single-file preview
        run: |
          python3 scripts/build_web.py
          python3 scripts/make_preview.py
      - uses: actions/upload-artifact@v7
        with:
          name: web-preview-${{ github.sha }}
          path: web/preview.html
          retention-days: 30

  build:
    name: Build ESP32-S3 firmware
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-s3-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e s3
      - name: LittleFS image (web files)
        run: pio run -e s3 -t buildfs
      - name: Firmware size
        run: pio run -e s3 -t size | tail -5
      - uses: actions/upload-artifact@v7
        with:
          name: usr-modem-v${{ needs.version.outputs.version }}-${{ github.sha }}
          path: |
            .pio/build/s3/firmware.bin
            .pio/build/s3/bootloader.bin
            .pio/build/s3/partitions.bin
            .pio/build/s3/littlefs.bin
            .pio/build/s3/firmware.elf
          retention-days: 30
